<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasty Bites – Admin</title>
<style>
:root{--bg:#f6f3ef;--card:#fff;--text:#2b2118;--muted:#7a6a5c;--accent:#e4572e;--line:#e6dccf}
@media (prefers-color-scheme:dark){:root{--bg:#161210;--card:#251d18;--text:#f6ece2;--muted:#b3a291;--line:#3a2d24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{font-weight:800;color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:24px 20px 60px}
h2{margin:24px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=email]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;width:100%}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.irow{display:grid;grid-template-columns:68px 1.1fr 90px 1.6fr 1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border:0}
.stock{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap;color:var(--text)}
.thumb{width:52px;height:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .emoji{font-size:1.6rem;line-height:1}
.upload{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.upload input{max-width:100%}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.del{background:transparent;color:#c0392b;border:1px solid #c0392b}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.hint{color:var(--muted);font-size:.85rem}
#login{max-width:340px;margin:80px auto;padding:0 20px}
#err{color:#c0392b;min-height:1.2em;font-size:.9rem}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:700px){.irow{grid-template-columns:60px 1fr 90px 1fr}.irow .d,.irow .upload,.irow .stock,.irow .del{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="logo">Tasty Bites · Admin</div><button class="btn ghost" id="logout" hidden>Log out</button></header>

<div id="login">
  <h2>Admin login</h2>
  <label>Email<input type="email" id="email" autocomplete="username" autofocus></label>
  <label>Password<input type="password" id="pw" autocomplete="current-password"></label>
  <p id="err"></p>
  <button class="btn" id="loginBtn">Log in</button>
</div>

<main id="panel" hidden></main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase/config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const credentialsConfigured = window.SUPABASE_URL && window.SUPABASE_ANON_KEY
  && !window.SUPABASE_URL.includes("YOUR-PROJECT")
  && !window.SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");
const supabaseClientAvailable = window.supabase && typeof window.supabase.createClient === "function";
const configured = credentialsConfigured && supabaseClientAvailable;
const supabaseClient = configured
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;
let data = null;

function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1400); }

function requireResult({ data: result, error }) {
  if (error) throw error;
  return result;
}

async function loadData() {
  const [configResult, itemsResult] = await Promise.all([
    supabaseClient.from("site_config").select("id,name,heading,sub,accent,cur,foot").eq("id", 1).single(),
    supabaseClient.from("menu_items").select("id,n,p,e,d,s,o,img").order("o", { ascending: true }),
  ]);
  return {
    config: requireResult(configResult),
    items: requireResult(itemsResult) || [],
  };
}

async function enterAdmin() {
  const { data: auth, error: authError } = await supabaseClient.auth.getUser();
  if (authError) throw authError;
  if (!auth.user) return;
  const { data: admin, error } = await supabaseClient.from("admin_users").select("user_id").eq("user_id", auth.user.id).maybeSingle();
  if (error) throw error;
  if (!admin) {
    await supabaseClient.auth.signOut();
    throw new Error("This account is not authorized as an admin.");
  }
  data = await loadData();
  $("login").hidden = true; $("panel").hidden = false; $("logout").hidden = false;
  render();
}
async function login() {
  if (!supabaseClient) {
    $("err").textContent = "Add the Supabase project URL and anon key to supabase/config.js.";
    return;
  }
  $("err").textContent = "";
  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
    if (error) throw error;
    await enterAdmin();
  } catch (error) {
    $("err").textContent = error.message;
  }
}
async function logout() {
  const { error } = await supabaseClient.auth.signOut();
  if (error) {
    toast("Couldn't log out");
    return;
  }
  location.reload();
}

function render() {
  const c = data.config, f = (k, l) => `<label>${l}<input type="text" data-cfg="${k}" value="${esc(c[k])}"></label>`;
  const items = data.items;
  $("panel").innerHTML = `<p class="hint">Changes save automatically and show on the main website within a few seconds.</p>
  <h2>Site settings</h2><div class="panel"><div class="fields">${f("name","Site name")}${f("heading","Main heading")}${f("sub","Subheading")}${f("cur","Currency symbol")}${f("foot","Footer text")}<label>Theme colour<input type="color" data-cfg="accent" value="${esc(c.accent)}"></label></div></div>
  <h2>Menu items</h2><div class="panel">${items.map(i => `<div class="irow" data-id="${esc(i.id)}"><div class="thumb">${i.img ? `<img src="${esc(i.img)}" alt="${esc(i.n)}">` : `<div class="emoji">${esc(i.e)}</div>`}</div><input type="text" data-f="e" value="${esc(i.e)}" aria-label="Emoji"><input type="text" data-f="n" value="${esc(i.n)}" aria-label="Name"><input type="number" data-f="p" min="0" value="${esc(i.p)}" aria-label="Price"><input class="d" type="text" data-f="d" value="${esc(i.d)}" aria-label="Description"><label class="stock"><input type="checkbox" data-f="s" ${i.s ? "checked" : ""}>In stock</label><label class="upload"><input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-upload="${esc(i.id)}"></label><button class="btn del" data-del="${esc(i.id)}">Delete</button></div>`).join("") || '<p class="hint">No items yet.</p>'}
  <p><button class="btn" id="addItem">+ Add item</button></p></div>`;
}

function itemFields(item) {
  return {
    n: String(item.n ?? "New item").slice(0, 80),
    p: Math.max(0, Number(item.p) || 0),
    e: String(item.e ?? "🍽️").slice(0, 8),
    d: String(item.d ?? "").slice(0, 300),
    s: !!item.s,
  };
}

async function saveItem(id, fields) {
  const { error } = await supabaseClient.from("menu_items").update(fields).eq("id", id);
  if (error) throw error;
}

function storagePathFromUrl(url) {
  const marker = "/storage/v1/object/public/menu-images/";
  const index = url.indexOf(marker);
  return index < 0 ? null : decodeURIComponent(url.slice(index + marker.length));
}

async function deleteStoredImage(url) {
  const path = storagePathFromUrl(url);
  if (!path) return;
  const { error } = await supabaseClient.storage.from("menu-images").remove([path]);
  if (error) throw error;
}

async function uploadItemImage(file, id) {
  if (!file) return;
  if (!["image/jpeg", "image/png", "image/webp", "image/gif"].includes(file.type)) {
    throw new Error("Choose a JPG, PNG, WebP, or GIF image.");
  }
  if (file.size > 5 * 1024 * 1024) throw new Error("Image must be 5 MB or smaller.");
  const current = data.items.find(item => item.id === id);
  const extension = file.type.split("/")[1].replace("jpeg", "jpg");
  const path = `${id}/${crypto.randomUUID()}.${extension}`;
  const { error: uploadError } = await supabaseClient.storage.from("menu-images").upload(path, file, { contentType: file.type });
  if (uploadError) throw uploadError;
  const { data: publicData } = supabaseClient.storage.from("menu-images").getPublicUrl(path);
  try {
    await saveItem(id, { img: publicData.publicUrl });
  } catch (saveError) {
    const { error: cleanupError } = await supabaseClient.storage.from("menu-images").remove([path]);
    if (cleanupError) throw new Error(`${saveError.message}; uploaded image cleanup failed: ${cleanupError.message}`);
    throw saveError;
  }
  data = await loadData();
  render();
  if (current && current.img) {
    try { await deleteStoredImage(current.img); }
    catch (cleanupError) {
      console.error("New image saved, but the previous image could not be removed:", cleanupError);
      toast("Image saved; previous image cleanup failed");
      return;
    }
  }
  toast("Image saved ✓");
}

$("panel").addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.dataset.cfg) {
      const { error } = await supabaseClient.from("site_config").update({ [t.dataset.cfg]: t.value }).eq("id", 1);
      if (error) throw error;
    }
    else if (t.dataset.f) {
      const k = t.dataset.f, id = t.closest(".irow").dataset.id;
      const value = k === "s" ? t.checked : k === "p" ? Number(t.value) || 0 : t.value;
      await saveItem(id, itemFields({ ...data.items.find(item => item.id === id), [k]: value }));
    } else if (t.dataset.upload) {
      await uploadItemImage(t.files && t.files[0], t.dataset.upload);
      t.value = "";
      return;
    } else return;
    toast("Saved ✓");
  } catch (err) { toast(err.message || "Couldn't save"); }
});
$("panel").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.id === "addItem") {
      const { error } = await supabaseClient.from("menu_items").insert({ n: "New item", p: 100, e: "🍽️", d: "Describe this item", s: true });
      if (error) throw error;
      data = await loadData(); render(); toast("Item added");
    }
    else if (b.dataset.del) {
      if (b.dataset.sure !== b.dataset.del) { b.dataset.sure = b.dataset.del; b.textContent = "Sure?"; return; }
      const current = data.items.find(item => item.id === b.dataset.del);
      const { error } = await supabaseClient.from("menu_items").delete().eq("id", b.dataset.del);
      if (error) throw error;
      data = await loadData(); render(); toast("Deleted");
      if (current && current.img) {
        try { await deleteStoredImage(current.img); }
        catch (cleanupError) {
          console.error("Menu item deleted, but its image could not be removed:", cleanupError);
          toast("Item deleted; image cleanup failed");
        }
      }
    }
  } catch (err) { toast(err.message || "Couldn't save"); }
});
$("loginBtn").onclick = login;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("logout").onclick = logout;
if (!credentialsConfigured) $("err").textContent = "Add the Supabase project URL and anon key to supabase/config.js.";
else if (!supabaseClientAvailable) $("err").textContent = "Could not load the Supabase client. Check your internet connection and refresh.";
else supabaseClient.auth.getSession().then(({ data: auth, error }) => {
  if (error) throw error;
  if (auth.session) return enterAdmin();
}).catch(error => { $("err").textContent = error.message; });
</script>
</body>
</html>
